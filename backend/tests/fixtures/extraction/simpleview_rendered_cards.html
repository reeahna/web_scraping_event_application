<!--
Sanitized SimpleView-style *rendered* events listing, mirroring the DOM the
legacy scraper parsed (`.item[data-type='events']` cards with `a.title`, a
`.mini-date-container` month/day, and `img.thumb`). Generic example domain and
invented events — this exercises the rendered-HTML card shape, not a real site.
The month/day carry no year, exactly like the live cards, so the year-inference
transform is exercised.
-->
<html>
<head><title>Events This Weekend</title></head>
<body>
  <main>
    <div class="results">
      <div class="item" data-type="events" data-recid="1001">
        <a class="title truncate" href="/event/riverside-food-truck-friday/1001/">Riverside Food Truck Friday</a>
        <div class="mini-date-container"><span class="month">Aug</span><span class="day">07</span></div>
        <img class="thumb" src="/img/food-truck.jpg" alt="" />
        <ul class="details"><li class="recurrence">Every Friday until Sep. 26, 2026</li></ul>
      </div>

      <div class="item" data-type="events" data-recid="1002">
        <a class="title truncate" href="/event/gem-and-mineral-show/1002/">Gem and Mineral Show</a>
        <div class="mini-date-container"><span class="month">Aug</span><span class="day">08</span></div>
        <img class="thumb" src="https://cdn.example.org/img/gem.jpg" alt="" />
      </div>

      <div class="item" data-type="events" data-recid="1003">
        <a class="title truncate" href="/event/downtown-gallery-walk/1003/">Downtown Gallery Walk</a>
        <div class="mini-date-container"><span class="month">Jan</span><span class="day">05</span></div>
        <img class="thumb" src="/img/gallery.jpg" alt="" />
      </div>

      <div class="item" data-type="promo">
        <a class="title" href="/promo/ignore-me/">Not an event card</a>
      </div>
    </div>
  </main>
</body>
</html>
